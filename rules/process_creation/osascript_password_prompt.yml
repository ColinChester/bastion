title: AppleScript Dialog Asking for a Password
id: db1eb639-0cba-4b75-beda-a7094ccec927
status: experimental
description: >
  osascript displayed a dialog with a hidden-answer field or password wording. Atomic
  (AMOS) and similar infostealers use fake system prompts to capture the login password.
author: Colin Chester (Bastion)
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1056.002
  - attack.execution
  - attack.t1059.002
logsource:
  product: macos
  category: process_creation
detection:
  image:
    Image|endswith: '/osascript'
  dialog:
    CommandLine|contains: 'display dialog'
  secret:
    CommandLine|contains:
      - 'hidden answer'
      - 'password'
  condition: image and dialog and secret
falsepositives:
  - Your own automation scripts that prompt for a password
level: high
