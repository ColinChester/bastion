title: Keychain Secrets Read With the security CLI
id: db453542-8db9-4b79-8fd3-0ea61dc4dbe6
status: experimental
description: >
  The security command dumped a keychain or printed a stored password. Stealers use this
  to get Chrome Safe Storage keys and saved credentials.
author: Colin Chester (Bastion)
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1555.001
logsource:
  product: macos
  category: process_creation
detection:
  image:
    Image|endswith: '/security'
  dump:
    CommandLine|contains: 'dump-keychain'
  find:
    CommandLine|contains:
      - 'find-generic-password'
      - 'find-internet-password'
  print_secret:
    CommandLine|contains:
      - ' -w'
      - ' -g'
      - ' -wa'
  filter_gh_cli:
    # GitHub CLI keeps its token in the keychain and reads it with this exact command.
    ParentImage|endswith: '/gh'
    CommandLine|contains: ' -s gh:'
  filter_gh_git_credential_helper:
    # git's credential helper runs `sh -c 'gh auth git-credential ...'`; gh then reads its
    # token. The shell, not gh, is recorded as the parent (issue 47). The parent command
    # line must be exactly that helper call: anything chained after it (; && | $()) or a gh
    # from another folder doesn't match.
    ParentImage:
      - /bin/sh
      - /bin/bash
      - /bin/zsh
    ParentCommandLine|re: '^/bin/(?:ba|z)?sh -c (?:/opt/homebrew/bin/|/usr/local/bin/)?gh auth git-credential(?: (?:"\$@"|[^\s;|&`$()<>]+))*$'
    CommandLine|contains: ' -s gh:github.com'
  filter_claude_code:
    # Claude Code reads its own login item (`claude auth status`). Only that item, and only
    # from Claude Code's install locations (issue 47).
    ParentImage|re: '(?:/\.vscode/extensions/anthropic\.claude-code-[0-9.]+-darwin-(?:arm64|x64)/resources/native-binary/claude|/\.local/share/claude/versions/[0-9.]+/claude|/\.claude/local/claude)$'
    CommandLine|contains: '-s Claude Code-credentials'
  condition: image and (dump or (find and print_secret)) and not 1 of filter_*
falsepositives:
  - Scripts of yours that read a token from the keychain
  - Other CLIs that keep their login in the keychain (add a filter for the exact item)
level: high
