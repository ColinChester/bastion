title: Keychain Secrets Read With the security CLI
id: db453542-8db9-4b79-8fd3-0ea61dc4dbe6
status: experimental
description: >
  The security command dumped a keychain or printed a stored password. Stealers use this
  to get Chrome Safe Storage keys and saved credentials.
author: Colin Chester (Bastion)
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1555.001
logsource:
  product: macos
  category: process_creation
detection:
  image:
    Image|endswith: '/security'
  dump:
    CommandLine|contains: 'dump-keychain'
  find:
    CommandLine|contains:
      - 'find-generic-password'
      - 'find-internet-password'
  print_secret:
    CommandLine|contains:
      - ' -w'
      - ' -g'
      - ' -wa'
  condition: image and (dump or (find and print_secret))
falsepositives:
  - Scripts of yours that read a token from the keychain
level: high
