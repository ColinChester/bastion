title: Quarantine Attribute Removed From a File
id: d6c44db1-7039-405f-8db5-91068c077fdd
status: experimental
description: >
  xattr stripped com.apple.quarantine (or cleared all attributes), which skips the
  Gatekeeper check on first launch. Common in "how to open this cracked app" guides.
author: Colin Chester (Bastion)
date: 2026-10-31
tags:
  - attack.defense-evasion
  - attack.t1553.001
logsource:
  product: macos
  category: process_creation
detection:
  image:
    Image|endswith: '/xattr'
  remove_quarantine:
    CommandLine|contains: 'com.apple.quarantine'
    CommandLine|re: '\s-[a-z]*d'
  clear_all:
    CommandLine|re: '\s-[a-z]*c'
  filter_chrome_updater:
    # GoogleUpdater unpacks Chrome and runs its .keystone_install script, which clears
    # quarantine on the new bundle.
    ParentCommandLine|contains|all:
      - '/com.google.GoogleUpdater.'
      - '/.keystone_install'
    CommandLine|contains: '/Applications/Google Chrome.app'
  filter_firefox_updater:
    ParentImage: '/Applications/Firefox.app/Contents/MacOS/updater.app/Contents/MacOS/org.mozilla.updater'
    CommandLine|contains: '/Applications/Firefox.app'
  condition: image and (remove_quarantine or clear_all) and not 1 of filter_*
falsepositives:
  - Running an unsigned open-source tool you trust (e.g. an emulator build)
level: medium
