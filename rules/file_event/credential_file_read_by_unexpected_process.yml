title: Credential Store Opened by an Unexpected Process
id: 774b4520-3dca-47ca-b495-f1c63bc6f15b
status: experimental
description: >
  A process outside the expected list opened an SSH private key, cloud credentials, or a
  browser cookie or saved-login store. Infostealers and malicious install scripts read
  exactly these files.
author: Colin Chester (Bastion)
date: 2026-10-31
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1552.004
  - attack.t1539
logsource:
  product: macos
  category: file_event
detection:
  selection:
    ActivityId: 2
    TargetFilename|contains:
      - '/.ssh/id_'
      - '/.aws/credentials'
      - '/.config/gcloud/'
      - '/.kube/config'
      - '/.docker/config.json'
      - '/Cookies'
      - '/Login Data'
      - '/logins.json'
      - '/key4.db'
  has_process:
    Image|exists: true
  filter_expected:
    Image|endswith:
      - '/ssh'
      - '/ssh-agent'
      - '/ssh-add'
      - '/ssh-keygen'
      - '/git'
      - '/git-remote-https'
      - '/aws'
      - '/gcloud'
      - '/kubectl'
      - '/docker'
      - '/Google Chrome'
      - '/Google Chrome Helper'
      - '/firefox'
      - '/Firefox'
      - '/plugin-container'
      - '/mds'
      - '/mds_stores'
      - '/mdworker_shared'
      - '/backupd'
      - '/Finder'
  filter_helpers:
    Image|contains:
      - '/Google Chrome Helper'   # Helper (Renderer), (GPU), (Plugin) variants
      - '/Firefox.app/Contents/MacOS/'
  filter_security_tools:
    Image|contains:
      - '/opt/osquery/'           # osquery hashes watched files for FSEvents
      - '/opt/bastion/'           # bastion posture checks credential files
      - '/Applications/Santa.app/'
  filter_apple_import:
    # Safari's "import from another browser" service, part of macOS
    Image|startswith: '/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app/'
    Image|endswith: '/com.apple.Safari.BrowserDataImportingService'
  condition: selection and has_process and not 1 of filter_*
falsepositives:
  - A backup, sync or editor app you use that reads these folders (add it to the filter)
level: high
