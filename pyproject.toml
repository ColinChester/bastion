[project]
name = "bastion"
version = "0.1.0"
description = "Autonomous multi-agent endpoint security for macOS (Phases 0-1: sensors, normalization, detection in shadow mode)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Colin Chester" }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pysigma>=0.11",
]

[project.scripts]
bastion = "bastion.cli:main"
bastiond = "bastion.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "bastion/_rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
