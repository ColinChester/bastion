[project]
name = "bastion"
version = "0.1.0"
description = "Autonomous multi-agent endpoint security for macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Colin Chester" }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Phase 3 executor: verify the gateway's command signatures and passkey approvals.
    "cryptography>=43",
    "webauthn>=2.2",
]

[project.optional-dependencies]
# The orchestrator and agents (Phase 2). Runs in a container; bastiond doesn't need these.
core = [
    "langgraph>=1.0",
    "anthropic>=0.80",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "tzdata",
    "cedarpy>=4",
]
tracing = [
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-anthropic>=0.1",
    "openinference-instrumentation-langchain>=0.1",
]
dev = [
    "bastion[core]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pysigma>=0.11",
    "cbor2>=5",
]

[project.scripts]
bastion = "bastion.cli:main"
bastiond = "bastion.daemon:main"
bastion-core = "bastion.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "bastion/_rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
