{
  "schedule": {
    "process_events": {
      "query": "SELECT e.pid, e.parent, e.path, e.cmdline, e.cwd, e.uid, e.username, e.signing_id, e.team_id, e.cdhash, e.platform_binary, e.codesigning_flags, e.event_type, e.time, p.path AS parent_path, p.cmdline AS parent_cmdline FROM es_process_events e LEFT JOIN processes p ON p.pid = e.parent WHERE e.event_type = 'exec' ORDER BY e.eid;",
      "interval": 10,
      "removed": false,
      "description": "Process executions from EndpointSecurity (needs Full Disk Access). env is deliberately not collected."
    },
    "file_events": {
      "query": "SELECT pid, parent, path, filename, dest_filename, event_type, time FROM es_process_file_events;",
      "interval": 10,
      "removed": false,
      "description": "EndpointSecurity file events with process context, limited to file_paths below."
    },
    "fs_events": {
      "query": "SELECT target_path, action, sha256, time FROM file_events;",
      "interval": 15,
      "removed": false,
      "description": "FSEvents changes under file_paths (catches new files the ES path filter can miss)."
    },
    "listening_ports": {
      "query": "SELECT lp.pid, lp.port, lp.protocol, lp.address, p.path, p.name FROM listening_ports lp LEFT JOIN processes p USING (pid) WHERE lp.port != 0 AND lp.protocol = 6 AND lp.address NOT IN ('127.0.0.1', '::1');",
      "interval": 60,
      "removed": false,
      "description": "TCP listeners reachable from the network. Unconnected UDP sockets (QUIC, mDNS) use random ports and would flood the first-seen baseline."
    },
    "open_sockets": {
      "query": "SELECT DISTINCT p.path, pos.remote_address, pos.remote_port, pos.protocol FROM process_open_sockets pos JOIN processes p USING (pid) WHERE pos.remote_port != 0 AND pos.family IN (2, 30) AND pos.remote_address NOT IN ('127.0.0.1', '::1', '', '0.0.0.0', '::');",
      "interval": 60,
      "removed": false
    },
    "launchd": {
      "query": "SELECT path, label, program, program_arguments, username FROM launchd;",
      "interval": 300,
      "description": "launchd jobs. Only identity columns: volatile ones (disabled, keep_alive) would re-emit unchanged jobs as 'added'."
    },
    "startup_items": {
      "query": "SELECT name, path, args, type, source, username FROM startup_items;",
      "interval": 300,
      "description": "Login items and background items (BTM). Identity columns only; status flips."
    },
    "apps": {
      "query": "SELECT name, path, bundle_identifier, bundle_short_version FROM apps;",
      "interval": 86400
    },
    "system_extensions": {
      "query": "SELECT identifier, version, state, team, bundle_path, category FROM system_extensions;",
      "interval": 3600
    },
    "trusted_roots": {
      "query": "SELECT common_name, sha1, path, not_valid_after FROM certificates WHERE ca = 1 AND path = '/Library/Keychains/System.keychain';",
      "interval": 3600
    }
  },
  "file_paths": {
    "persistence": [
      "/Library/LaunchAgents/%%",
      "/Library/LaunchDaemons/%%",
      "/Users/%/Library/LaunchAgents/%%"
    ],
    "shell_profiles": [
      "/Users/%/.zshrc",
      "/Users/%/.zprofile",
      "/Users/%/.zshenv",
      "/Users/%/.zlogin",
      "/Users/%/.bashrc",
      "/Users/%/.bash_profile",
      "/Users/%/.profile"
    ],
    "credentials": [
      "/Users/%/.ssh/%%",
      "/Users/%/.aws/%%",
      "/Users/%/.config/gcloud/%%",
      "/Users/%/.kube/config",
      "/Users/%/.docker/config.json",
      "/Users/%/Library/Application Support/Google/Chrome/%/Cookies",
      "/Users/%/Library/Application Support/Google/Chrome/%/Login Data",
      "/Users/%/Library/Application Support/Firefox/Profiles/%/cookies.sqlite",
      "/Users/%/Library/Application Support/Firefox/Profiles/%/logins.json",
      "/Users/%/Library/Application Support/Firefox/Profiles/%/key4.db"
    ]
  }
}
