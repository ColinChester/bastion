# Bastion stack, on the Mac. Start it with scripts/setup-phase2.sh; scripts/setup-phase3.sh
# adds the action gateway (the "actions" profile, switched on in deploy/.env).
#
# Every published port binds to 127.0.0.1. The phone reaches the incident page and ntfy
# through Tailscale Serve (tailnet only), never the open internet.
name: bastion

x-core: &core
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: .env
  environment:
    BASTION_EDGE_URL: http://host.docker.internal:8765
    BASTION_NTFY_URL: http://ntfy:80
    PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    BASTION_GATEWAY_URL: http://gateway:8788
  # host.docker.internal (the Mac itself) is provided by OrbStack and Docker Desktop.
  volumes:
    - core-data:/data
  restart: unless-stopped
  # The container needs nothing from its own filesystem or the kernel.
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  core:
    <<: *core
    command: ["bastion-core", "run"]
    depends_on: [ntfy, phoenix]

  web:
    <<: *core
    command: ["bastion-core", "web"]
    environment:
      BASTION_EDGE_URL: http://host.docker.internal:8765
      BASTION_GATEWAY_URL: http://gateway:8788
      # The console never talks to a model, so it doesn't get the API key.
      ANTHROPIC_API_KEY: ""
    ports:
      - "127.0.0.1:8787:8787"

  gateway:
    # Phase 3. The only container that holds the command-signing key. It decides each
    # proposed action with the Cedar policies in policy/ and signs what is allowed.
    # It has no model key, no published port and no data volume.
    profiles: [actions]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["bastion-core", "gateway"]
    env_file:
      - path: .env.gateway
        required: false
    environment:
      BASTION_EDGE_URL: http://host.docker.internal:8765
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8090}
      # iOS only delivers instant pushes via Apple's servers, which ntfy reaches through
      # ntfy.sh. It forwards a "new message" poll request, not the message content.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_BEHIND_PROXY: "true"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

  phoenix:
    # Traces include telemetry from the Mac, so they stay in this local container.
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Phoenix turns login on by default when it listens on 0.0.0.0, which it must inside
      # a container. That also makes it reject the core's traces (no API key). It is only
      # reachable from the compose network and 127.0.0.1 on the Mac, so login stays off.
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix-data:/mnt/data
    ports:
      - "127.0.0.1:6006:6006"
    restart: unless-stopped

volumes:
  core-data:
  ntfy-cache:
  phoenix-data:
